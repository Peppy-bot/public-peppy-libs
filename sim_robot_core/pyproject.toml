[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim_robot_core"
version = "0.1.0"
description = "What a simulation engine node knows about the robots it stands, whatever its physics: the registry of standing robots, the four pairing slots and what each pair names, one entry per robot model built from the robot's description with its checks, and the camera configuration. The engine supplies its gains, its model files and its transport."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyjson5>=1.6", "robot_description_py"]

[tool.hatch.build.targets.wheel]
packages = ["src/sim_robot_core"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
# The bindings beside this package in the same checkout. An engine's image
# installs both from one commit of this repository.
robot_description_py = { path = "../robot_description_py" }
