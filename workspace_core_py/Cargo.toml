[package]
name = "workspace_core_py"
version = "0.1.0"
edition = "2024"
description = "Python bindings of workspace_core for a robot's backbone in Python: the limits, the grasp directions, the parsing of a workspace:v1 request, the reach memo, and the answers of a robot without a perception camera."
publish = false

# A workspace root of its own, so cargo's search for one ends at this manifest
# whatever sits above this repository, which is what lets a consumer pull the
# package by git from any checkout layout.
[workspace]

# The extension module that Python imports as workspace_core_py.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The stable ABI of Python 3.12: one build loads on every Python from 3.12.
pyo3 = { version = "0.29", features = ["abi3-py312"] }
workspace_core = { path = "../workspace_core" }
