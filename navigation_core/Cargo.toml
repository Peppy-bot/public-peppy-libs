[package]
name = "navigation_core"
version = "0.1.0"
edition = "2024"
description = "What a mobile base needs to plan a path around what it sees and to drive it, ported from Nav2 1.5.2: a cost grid with Nav2's cost values, a base's outline padded as Nav2 pads it, with its inscribed and circumscribed radii, depth frames and laser scans kept in an occupancy_map cleared under the footprint and projected to a grid in a height band with the drops below the floor, a saved trinary map as the static layer takes it, inflation by Nav2's inflation layer, the layers composed as a layered cost map composes them, Smac 2D's A* to the goal's cell with its smoother, a plan pruned and judged as Nav2's controller server prunes it and its goal and progress checkers judge it, Nav2's regulated pure pursuit, and a stop as Nav2's collision monitor slows a base in its approach mode on the grid's occupied cells and the columns of each source's newest frame, with a stop while a source's readings stop arriving. No ROS, hardware or messaging deps."

[workspace]

[dependencies]
camera_core = { path = "../camera_core" }
control_core = { path = "../control_core" }
frame_tree = { path = "../frame_tree" }
libstdcxx_heap = { path = "../libstdcxx_heap" }
occupancy_map = { path = "../occupancy_map" }
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
ros_reference = { path = "../ros_reference" }

[profile.dev]
opt-level = 1
