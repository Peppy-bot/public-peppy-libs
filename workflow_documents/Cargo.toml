[package]
name = "workflow_documents"
version = "0.1.0"
edition = "2024"
description = "The documents of the workflow side: workflow/v1, the program of the robots; run/v1, one run of it with its roles bound to robots; and workflow_bundle/v1, a workflow carried out of the chat with the digest of each file and the lock of the versions it ran with. Each carries the root key, the manifest and the digest of documents_core. Parses the expressions of a workflow, a subset of CEL, types them and evaluates them; holds the structural rules of a workflow that need no contract, the marks that the checker of the workflow director reads, and the JSON texts of the events and the results of a run. Pure Rust, no hardware or messaging deps."

[workspace]

[dependencies]
cel = { version = "0.15", default-features = false }
documents_core = { path = "../documents_core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.50", features = ["static-engine"] }
