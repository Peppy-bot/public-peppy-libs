[package]
name = "control_core"
version = "0.1.0"
edition = "2024"
description = "Shared control-loop and runtime primitives for the robot nodes and the kinematics crates: pacing, filtering, rate limiting, motion timing, motor health, a mobile base's footprint, its body velocity, its limiter and its wheel odometry, where a frame sits on the floor plane, the geometry types of the contracts with their one parse and their planar forms, times on a ROS clock, the setpoint stream, the single-flight move slot of a goal, the service, receive and ask loops, the fault that ends a node, the model a component is configured for, latched failure logging, a node's wall or simulation clock and the wait until a deadline on it, a robot's tree of frames with the lookups that wait on that clock and the placing of a value of the geometry types in a frame of it, waiting and locking from synchronous code, and the reason a robot stop gives each move it ends. Pure Rust, no hardware or messaging deps; its nalgebra feature gives the geometry types as nalgebra holds them."

# A workspace root of its own, so cargo's search for one ends at this manifest
# whatever sits above this repository, which is what lets a consumer pull the
# package by git from any checkout layout.
[workspace]

[features]
nalgebra = ["dep:nalgebra", "frame_tree/nalgebra"]

[dependencies]
frame_tree = { path = "../frame_tree" }
nalgebra = { version = "0.35", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
ros_reference = { path = "../ros_reference" }
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = "0.3"
