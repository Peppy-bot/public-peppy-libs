[package]
name = "control_core"
version = "0.1.0"
edition = "2024"
description = "Shared control-loop and runtime primitives for the robot nodes and the kinematics crates: pacing, filtering, rate limiting, motion timing, motor health, the setpoint stream, latched failure logging, and waiting and locking from synchronous code. Pure Rust, no hardware or messaging deps."

# A workspace root of its own, so cargo's search for one ends at this manifest
# whatever sits above this repository, which is what lets a consumer pull the
# package by git from any checkout layout.
[workspace]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.50", features = ["static-engine"] }
tokio = { version = "1", features = ["test-util"] }
