[package]
name = "chain_kinematics"
version = "0.1.0"
edition = "2024"
description = "Forward kinematics, the geometric Jacobian, damped resolved-rate steps and MoveIt's KDL inverse kinematics for any serial chain read from a URDF. Robot-agnostic and generic over the number of joints. Pure Rust, no hardware or messaging deps."

# A workspace root of its own, so cargo's search for one ends at this manifest
# whatever sits above this repository, which is what lets a consumer pull the
# package by git from any checkout layout.
[workspace]

[dependencies]
nalgebra = "0.35"
thiserror = "2"
urdf-rs = "0.10"

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
kinematics_properties = { path = "../kinematics_properties" }
robot_description = { path = "../robot_description" }
ros_reference = { path = "../ros_reference" }
serde_json = "1"
