[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control_core_py"
version = "0.1.0"
description = "Shared primitives for Python peppy control nodes: asyncio stream plumbing (paced ticks, gated wire-input consumption, service serving, capture-time wire stamps), parameter validators, minimum-jerk profiles, the rounded joint paths of limb_motion's execute_joint_path and their timing, and the hardware device-thread skeleton. Pure Python, no hardware or messaging deps; control_core's Python sibling."
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/control_core_py"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Each asynchronous fixture runs in the event loop of its test.
asyncio_default_fixture_loop_scope = "function"
