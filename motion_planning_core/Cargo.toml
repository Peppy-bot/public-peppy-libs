[package]
name = "motion_planning_core"
version = "0.1.0"
edition = "2024"
description = "Plans the paths of one serial chain of joints around a voxel map of what its cameras see: a state keeps a clearance from every occupied voxel and between the pairs of the robot's self model, a motion is checked by conservative advancement, goals are sampled by inverse kinematics, OMPL plans and simplifies, and the path the robot will run, its corners rounded, is checked before it is answered. Knows no robot."

[workspace]

[dependencies]
chain_kinematics = { path = "../chain_kinematics" }
collision_geometry = { path = "../collision_geometry" }
control_core = { path = "../control_core" }
nalgebra = "0.35"
occupancy_map = { path = "../occupancy_map" }
ompl_bridge = { path = "../ompl_bridge" }
thiserror = "2"

[dev-dependencies]
camera_core = { path = "../camera_core" }
hegeltest = { version = "0.51", features = ["static-engine"] }
kinematics_properties = { path = "../kinematics_properties" }
openarm_description = { path = "../openarm_description", features = ["meshes"] }
ros_reference = { path = "../ros_reference" }
serde_json = "1"
srs_model = { path = "../srs_model" }
urdf-rs = "0.10"

[profile.dev]
opt-level = 1
