[package]
name = "motion_planning_core"
version = "0.1.0"
edition = "2024"
description = "Plans the paths of one or more serial chains of joints, moved together, around a voxel map of what its cameras see and the objects of its planning scene: a state keeps a clearance from every occupied voxel and every collision object, and between the pairs of the robot's self model, between an object one arm carries and another arm or its objects, and between an attached object and the arm that carries it; the planning scene holds MoveIt's collision objects, attached objects and allowed pairs; a motion is checked by conservative advancement; each arm's goal is sampled by inverse kinematics and the arms' configurations paired; OMPL makes the request's attempts in batches of ompl_bridge's PLANNING_THREADS and simplifies their path, all by the request's deadline; the path the robot will run, its corners rounded, is checked before it is answered; a caller's path is checked with the same checks; and a depth frame's points go into the map with the robot and the objects cut out where a history of its joint positions puts the robot at the frame's stamp. Knows no robot."

[workspace]

[dependencies]
camera_core = { path = "../camera_core" }
chain_kinematics = { path = "../chain_kinematics" }
collision_geometry = { path = "../collision_geometry" }
control_core = { path = "../control_core" }
nalgebra = "0.35"
occupancy_map = { path = "../occupancy_map" }
ompl_bridge = { path = "../ompl_bridge" }
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
json5 = "1.3"
kinematics_properties = { path = "../kinematics_properties" }
openarm_description = { path = "../openarm_description", features = ["meshes"] }
ros_reference = { path = "../ros_reference" }
self_collision_model = { path = "../self_collision_model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
so101_description = { path = "../so101_description" }
srs_model = { path = "../srs_model" }
statrs = "0.19"
urdf-rs = "0.10"

[profile.dev]
opt-level = 1
