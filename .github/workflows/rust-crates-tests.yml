name: Rust crates Tests

# CI for the repository's Rust libraries: every top-level directory holding a
# Cargo.toml is discovered from the filesystem and runs its own suite. Each is
# its own workspace root with its own lockfile, so they cannot be tested as one
# `cargo test --workspace`; they share a target directory instead, so a
# dependency two of them have in common is compiled once and the box's cache
# carries it between runs.

on:
  push:
    branches: [main]
    paths:
      - '*/Cargo.toml'
      - '*/Cargo.lock'
      - '*/src/**'
      - '*/tests/**'
      - '*/assets/**'
      - '.github/workflows/rust-crates-tests.yml'
  # No `paths` filter here, mirroring python-libs-tests.yml: a required status
  # check that a `paths` filter suppresses never reports at all and blocks the
  # pull request with nothing to wait for. The path decision lives in the
  # `changes` job instead, and a skipped `test` job reports success.
  pull_request:
    branches: [main]

concurrency:
  group: rust-crates-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust crates were touched, so an unrelated pull request
  # skips the `test` job rather than building it. Reads changed files from the
  # API and needs no checkout, but it runs on the self-hosted runner like
  # everything else, so it queues behind whatever the box is building before it
  # can rule a pull request out.
  changes:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_crates: ${{ steps.filter.outputs.rust_crates }}

    steps:
      # Skipped on push, where the trigger's own `paths` filter decided.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust_crates:
              - '*/Cargo.toml'
              - '*/Cargo.lock'
              - '*/src/**'
              - '*/tests/**'
              - '*/assets/**'
              - '.github/workflows/rust-crates-tests.yml'

  # Skipping reports the check as successful, letting pull requests that leave
  # the Rust crates alone satisfy a required check and merge.
  #
  # openarm_can's bus tests read OPENARM_CAN_TEST_IFACE for a CAN interface to
  # drive and skip themselves when it names none, which is what they do here:
  # the interface would be a virtual CAN link, and the runner kernel carries no
  # vcan module to create one with. What this job holds that crate to is
  # therefore that it compiles and its host-only tests pass; the bus tests are
  # run against a vcan link on a development machine, as their module
  # documentation describes.
  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust_crates == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The self-hosted box is provisioned outside this repository and ships no
      # Rust, so the toolchain is installed here: a workflow that leaned on what
      # happens to be on the box would break with no commit to blame. Both
      # halves are skipped when already satisfied, so a warm box pays nothing.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup > /dev/null; then
            echo "rustup absent; installing"
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if ! rustup default 2>/dev/null | grep -q '^stable-'; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustc --version

      # The box's own cargo configuration sets a `rustc-wrapper` of sccache
      # (nothing in this repository does), and cargo fails outright when the
      # wrapper it is told to use is not on disk: `could not execute process
      # .../sccache .../rustc -vV (never executed)`. So install it when it is
      # missing, skip when it is already there, and fall back to disabling the
      # wrapper for this job if the download fails: a slower build beats a red
      # suite over a compiler cache. The musl build is static, so it needs no
      # runtime libraries.
      - name: Install sccache when the runner's cargo config expects one
        shell: bash
        env:
          SCCACHE_VERSION: v0.18.0
        run: |
          set -uo pipefail
          # `cargo config get` would answer this directly but is nightly-only, so
          # read the two places the setting can reach a stable cargo: the
          # environment, and the user-global cargo config where the box's own
          # setting lives. A workspace .cargo/config.toml could set it too; none
          # in this repository does.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          wrapper="${RUSTC_WRAPPER:-${CARGO_BUILD_RUSTC_WRAPPER:-}}"
          if [ -z "$wrapper" ]; then
            for config in "$cargo_home/config.toml" "$cargo_home/config"; do
              [ -f "$config" ] || continue
              wrapper=$(sed -n 's/^[[:space:]]*rustc-wrapper[[:space:]]*=[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}.*/\1/p' "$config" | head -1)
              [ -n "$wrapper" ] && break
            done
          fi
          if [ -z "$wrapper" ]; then
            echo "no rustc-wrapper configured; nothing to install"
            exit 0
          fi
          if [ -x "$wrapper" ] || command -v "$(basename "$wrapper")" > /dev/null; then
            echo "rustc-wrapper $wrapper is already available"
            exit 0
          fi
          echo "rustc-wrapper $wrapper is configured but absent; installing sccache $SCCACHE_VERSION"
          tarball="sccache-$SCCACHE_VERSION-x86_64-unknown-linux-musl"
          url="https://github.com/mozilla/sccache/releases/download/$SCCACHE_VERSION/$tarball.tar.gz"
          if curl -fsSL --connect-timeout 10 --max-time 180 "$url" | tar -xzf - -C "$RUNNER_TEMP"; then
            mkdir -p "$HOME/.cargo/bin"
            install -m 0755 "$RUNNER_TEMP/$tarball/sccache" "$HOME/.cargo/bin/sccache"
            "$HOME/.cargo/bin/sccache" --version
          else
            echo "::warning::could not install sccache; building without the wrapper"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      # Every discovered crate runs even after one fails, so a red run names
      # every failing crate instead of the first. `--all-features` because a
      # feature of a library crate is an interface a consumer compiles (the
      # openarm nodes take openarm_description's `meshes`), and one no suite
      # builds is one nothing holds to compiling.
      - name: Run every Rust crate's suite
        run: |
          set -euo pipefail
          failed=()
          for manifest in */Cargo.toml; do
            crate=$(dirname "$manifest")
            echo "::group::cargo test: $crate"
            if (cd "$crate" && cargo test --locked --all-features); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::cargo test failed in $crate"
              failed+=("$crate")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing crates: ${failed[*]}" >&2
            exit 1
          fi

      # The locked builds above must have consumed the committed lockfiles, not
      # rewritten them, so the tested dependency graph is the shipped one.
      - name: Prove CI did not rewrite the shipping lockfiles
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- '*/Cargo.lock'
