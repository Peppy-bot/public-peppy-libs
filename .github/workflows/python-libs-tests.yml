name: Python libs Tests

# CI for the repository's Python libraries: every top-level directory holding a
# pyproject.toml and a tests/ tree is discovered from the filesystem and runs
# its suite from its own uv environment, resolved --frozen against its
# committed uv.lock. The suites are self-contained unit tests: no peppy daemon,
# no container runtime, no hardware. A library with a Rust extension module
# builds it when uv installs it, from its committed Cargo.lock and its Rust
# siblings here, so the job has the Rust toolchain too.

on:
  push:
    branches: [main]
    paths:
      - '*/pyproject.toml'
      - '*/uv.lock'
      - '*/src/**'
      - '*/tests/**'
      - '*/*.pyi'
      - '*/Cargo.toml'
      - '*/Cargo.lock'
      - '*/.cargo/**'
      - '.github/actions/rust-toolchain/**'
      - '.github/workflows/python-libs-tests.yml'
  # No `paths` filter here, mirroring rust-crates-tests.yml: a required status
  # check that a `paths` filter suppresses never reports at all and blocks the
  # pull request with nothing to wait for. The path decision lives in the
  # `changes` job instead, and a skipped `test` job reports success.
  pull_request:
    branches: [main]

concurrency:
  group: python-libs-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # As in rust-crates-tests.yml: decides whether the Python libs were touched,
  # so an unrelated pull request skips the `test` job rather than building it.
  # The smallest RunsOn runner: it reads the changed files from the API.
  changes:
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8/family=c8a+c7a+m8a+m7a  # custom Peppy AMI
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python_libs: ${{ steps.filter.outputs.python_libs }}

    steps:
      # Reads changed files from the API on a pull request, no checkout needed;
      # skipped on push, where the trigger's own `paths` filter decided.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python_libs:
              - '*/pyproject.toml'
              - '*/uv.lock'
              - '*/src/**'
              - '*/tests/**'
              - '*/*.pyi'
              - '*/Cargo.toml'
              - '*/Cargo.lock'
              - '*/.cargo/**'
              - '.github/actions/rust-toolchain/**'
              - '.github/workflows/python-libs-tests.yml'

  # Skipping reports the check as successful, letting pull requests that leave
  # the Python libs alone satisfy a required check and merge.
  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python_libs == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=4/ram=8+16/family=c8a+c7a+m8a+m7a  # custom Peppy AMI
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # For the libraries that build a Rust extension module when uv installs
      # them.
      - uses: ./.github/actions/rust-toolchain

      # Pinned rather than latest: uv resolves and installs everything the
      # suites run against, so its version is part of what a green run attests.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 120 \
            https://astral.sh/uv/0.12.1/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Every discovered lib runs even after one fails, so a red run names
      # every failing lib instead of the first. The trailing diff proves the
      # frozen installs consumed the committed manifests and lockfiles.
      - name: Run every Python lib's suite
        run: |
          set -euo pipefail
          failed=()
          for manifest in */pyproject.toml; do
            lib=$(dirname "$manifest")
            [ -d "$lib/tests" ] || continue
            echo "::group::pytest: $lib"
            if (cd "$lib" && uv sync --frozen --quiet && uv run --frozen pytest); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::pytest failed in $lib"
              failed+=("$lib")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing libs: ${failed[*]}" >&2
            exit 1
          fi

      - name: Prove CI tested the committed manifests and lockfiles
        run: git diff --exit-code -- '*pyproject.toml' '*uv.lock'
