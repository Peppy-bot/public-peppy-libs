name: peppy-shared Tests

# Standalone CI for the `peppy-shared` virtual workspace
# (public-peppy-libs/peppy-shared). The workspace is now self-contained: every
# path dependency resolves to a sibling crate within peppy-shared (config,
# core-node-api, peppy-messaging-interface, build-helpers, peppylib-rs), so it no
# longer needs the superproject checkout to build and can be tested here, in the
# repo that owns the code.

on:
  push:
    branches: [main]
    paths:
      - 'peppy-shared/**'
      - '.github/workflows/peppy-shared-tests.yml'
  # No `paths` filter here, unlike the push trigger: `test` is a required status
  # check on `main`, and a workflow that `paths` filters out never reports its
  # check at all, which leaves the pull request blocked with nothing to wait for.
  # The path decision moves into the `changes` job below instead.
  pull_request:
    branches: [main]

concurrency:
  group: peppy-shared-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether a pull request touches the workspace, so that a pull request
  # leaving `peppy-shared/` alone skips the `test` job below rather than building
  # it. The filter reads the changed files from the API and needs no checkout, but
  # it runs on the self-hosted runner like everything else, so it queues behind
  # whatever the box is building before it can rule a pull request out.
  changes:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    outputs:
      peppy_shared: ${{ steps.filter.outputs.peppy_shared }}

    steps:
      # On a pull request the action reads the changed files from the API, so it
      # needs no checkout. The step is skipped on push, where the trigger's own
      # `paths` filter has already made the decision.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            peppy_shared:
              - 'peppy-shared/**'
              - '.github/workflows/peppy-shared-tests.yml'

  # Skipping this job reports the `test` check as successful, which is what lets a
  # pull request outside `peppy-shared/` satisfy the required check and merge.
  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.peppy_shared == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted runner images shipped Rust; the self-hosted box is
      # provisioned outside this repository and ships none, so the toolchain is
      # installed here for the same reason pixi and uv are below — a workflow
      # that leaned on what happens to be on the box would break with no commit
      # to blame. Both halves are skipped when already satisfied, so a warm box
      # pays nothing: the runner takes one job at a time, and re-resolving a
      # toolchain in every job would be pure queue time.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup > /dev/null; then
            echo "rustup absent; installing"
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if ! rustup default 2>/dev/null | grep -q '^stable-'; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustc --version

      # Give this run its own peppy data root so the reused self-hosted runner
      # does not accumulate or collide on /tmp/.peppy across runs.
      - name: Set up isolated peppy data root
        run: |
          PEPPY_RUN_HOME="$RUNNER_TEMP/peppy-home"
          mkdir -p "$PEPPY_RUN_HOME/tmpdir"
          echo "PEPPY_RUN_HOME=$PEPPY_RUN_HOME" >> "$GITHUB_ENV"

      # Rust workspace tests. Exclude peppylib-py: its cdylib build and
      # tests/python_tests.rs only wrap `pixi run test`, which the dedicated
      # Python step below runs directly.
      #
      # `--locked` enforces the committed Cargo.lock. The lock is workspace-global,
      # so this validates it against every member's manifest (peppylib-py included,
      # despite its tests being excluded) and fails the build if the lock is stale —
      # surfacing dependency drift in CI instead of silently re-resolving.
      - name: Run Rust tests
        working-directory: peppy-shared
        run: |
          export PEPPY_HOME="$PEPPY_RUN_HOME" TMPDIR="$PEPPY_RUN_HOME/tmpdir"
          cargo test --workspace --exclude peppylib-py --locked

      # Installed here rather than assumed of the runner: the self-hosted box is
      # provisioned outside this repository, so a workflow that leaned on what
      # happens to be on it would break with no commit to blame. Pinned to the
      # version the workspace's `requires-pixi` documents as tested (pixi.lock
      # is format v7), and `pixi install` runs `--locked` by default so a stale
      # lock fails CI instead of being silently re-resolved.
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.72.0
          manifest-path: peppy-shared/peppylib-py/pixi.toml

      # Installed here for the same reason: peppylib-py's build.rs requires uv
      # on PATH, and the Python suite launches its test nodes with `uv run`.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Python tests for the peppylib-py extension: `pixi run test` builds the
      # native module with `maturin develop` and runs the pytest suite.
      - name: Run peppylib-py Python tests
        working-directory: peppy-shared/peppylib-py
        run: |
          export PEPPY_HOME="$PEPPY_RUN_HOME" TMPDIR="$PEPPY_RUN_HOME/tmpdir"
          pixi run test

      # Reclaim the per-run data root so disk does not grow on every run.
      - name: Clean up isolated peppy data root
        if: always()
        run: rm -rf "$RUNNER_TEMP/peppy-home"
