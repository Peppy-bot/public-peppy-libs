[package]
name = "camera_core"
version = "0.1.0"
edition = "2024"
description = "What the camera nodes and workspace_core, which reads them, share: the failure of a control write by its kind, the errno mapping and its error reply in a generated service, the value a control answers when it has none, the auto/manual mode, the color encodings and the depth one, a z16 depth frame read pixel by pixel, the V4L2 control ids, the checks a camera geometry passes, a stream's pinhole model with its lens, or a rendered camera's, and the arithmetic between its pixels and points, the depth model of a stream, where one frame sits in another as tf2 applies a pose, the `z` depth model and the refusal a color camera gives for its depth members, and the pieces of a simulated camera's relay that name no generated type."

[workspace]

[dependencies]
libc = "0.2"
