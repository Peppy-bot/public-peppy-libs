[package]
name = "frame_tree"
version = "0.1.0"
edition = "2024"
description = "tf2's buffer in Rust: the transforms between a robot's frames that the transforms contract carries, kept per child frame with a history in a window the caller sets, and the place of any frame in any other at a time or at the latest time common to the chain, interpolated and composed in tf2's arithmetic, with tf2's extrapolation errors, and an error naming the transform where two publishers or a cycle break the tree. Pure Rust, no hardware or messaging deps."

[workspace]

[dependencies]
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
ros_reference = { path = "../ros_reference" }
