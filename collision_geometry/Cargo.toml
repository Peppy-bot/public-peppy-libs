[package]
name = "collision_geometry"
version = "0.1.0"
edition = "2024"
description = "Collision geometry for any robot: convex pieces fitted to the URDF collision elements, clip regions for a concave body, GJK/EPA distance between convex shapes, and the pieces of a serial chain placed at a joint configuration, with a bounding sphere per piece and MoveIt's padded point containment per link. Rust, with Qhull (C) for the exact convex hulls; no hardware or messaging deps."

[workspace]

[dependencies]
chain_kinematics = { path = "../chain_kinematics" }
nalgebra = "0.35"
qhull = "0.4"
thiserror = "2"
urdf-rs = "0.10"

[dev-dependencies]
hegeltest = { version = "0.50", features = ["static-engine"] }
kinematics_properties = { path = "../kinematics_properties" }
libc = "0.2"
openarm_description = { path = "../openarm_description" }
rand = "0.10"
ros_reference = { path = "../ros_reference" }

[[test]]
name = "fit_prints_nothing"
harness = false

[profile.dev]
opt-level = 1
