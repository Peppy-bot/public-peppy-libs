[package]
name = "self_collision_model"
version = "0.1.0"
edition = "2024"
description = "Runtime self-collision detection for a robot with two 7-DOF SRS arms: the minimum distance between its bodies over the checked pairs, from the convex pieces collision_geometry fits to its URDF, and the analytic distance gradient. No hardware or messaging deps."

# A workspace root of its own, so cargo's search for one ends at this manifest
# whatever sits above this repository, which is what lets a consumer pull the
# package by git from any checkout layout.
[workspace]

[dependencies]
collision_geometry = { path = "../collision_geometry" }
srs_model = { path = "../srs_model" }
thiserror = "2"

[dev-dependencies]
openarm_description = { path = "../openarm_description" }
ros_reference = { path = "../ros_reference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Construction hulls and decomposes the meshes; those numeric loops crawl
# unoptimized, so tests build this crate with light optimization.
[profile.dev]
opt-level = 1
