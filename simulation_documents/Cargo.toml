[package]
name = "simulation_documents"
version = "0.1.0"
edition = "2024"
description = "The documents of the simulation side: world/v1, which carries the root key, the manifest and the digest of documents_core, and the JSON5 texts without a root key that a simulation exchanges: the setup record it keeps, from which the world of a live simulation is made with the robots of the stack, and the judges that check ground truth in a live world, with their verdicts. Pure Rust, no hardware or messaging deps."

[workspace]

[dependencies]
documents_core = { path = "../documents_core" }
json5 = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
thiserror = "2"

[dev-dependencies]
hegeltest = { version = "0.50", features = ["static-engine"] }
